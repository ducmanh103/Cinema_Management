# ==========================================
# Docker Compose - Production
# ==========================================
# Sử dụng: docker compose -f docker-compose.prod.yml up -d
# Yêu cầu: file .env.prod cùng thư mục

services:
  # ── 1. PostgreSQL Database ──
  postgres_db:
    image: postgres:16-alpine
    container_name: cinemahub_postgres
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_DB: ${DB_NAME:-CinemaManagement}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"  # Chỉ expose localhost, không public
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./DB/CinemaManagement_PostgreSQL.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-CinemaManagement}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - cinemahub_net

  # ── 2. CinemaHub Web Application (.NET 8) ──
  web_app:
    image: ghcr.io/ducmanh103/cinema_management:latest
    container_name: cinemahub_web
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
    expose:
      - "8080"  # Internal only, Nginx handles external traffic
    env_file:
      - .env.prod
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=${DB_NAME:-CinemaManagement};Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Gemini__Model=${GEMINI_MODEL:-gemini-2.5-flash}
      - VnPay__TmnCode=${VNPAY_TMN_CODE}
      - VnPay__HashSecret=${VNPAY_HASH_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - cinemahub_net

  # ── 3. Nginx Reverse Proxy ──
  nginx:
    image: nginx:alpine
    container_name: cinemahub_nginx
    restart: unless-stopped
    depends_on:
      web_app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - cinemahub_net

  # ── 4. Certbot (Let's Encrypt SSL) ──
  certbot:
    image: certbot/certbot
    container_name: cinemahub_certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Chạy thủ công lần đầu:
    # docker compose -f docker-compose.prod.yml run --rm certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
    # Renew tự động:
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - cinemahub_net

volumes:
  pgdata:
  certbot_webroot:

networks:
  cinemahub_net:
    driver: bridge
