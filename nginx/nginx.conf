worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server_tokens off;

    # ========================================================
    # Cấu hình OneShield DNS Proxy - Lấy IP thật của khách truy cập
    # ========================================================
    # Dải IP IPv4 của OneShield:
    set_real_ip_from 103.216.118.0/27;
    set_real_ip_from 103.56.163.0/27;
    set_real_ip_from 103.166.183.0/27;
    set_real_ip_from 103.72.98.10;
    set_real_ip_from 103.72.97.5;
    set_real_ip_from 103.72.96.10;

    # Dải IP IPv6 của OneShield:
    set_real_ip_from 2001:df7:ce00:19::3:0000/112;
    set_real_ip_from 2001:0df7:ce00:16::3:0000/112;
    set_real_ip_from 2001:0df7:ce00:22::3:0000/112;
    set_real_ip_from 2001:df0:1b:3::3:0;
    set_real_ip_from 2001:df0:1b:2::3:0;
    set_real_ip_from 2001:df0:1b:1::3:0;

    # Sử dụng header X-Forwarded-For để giải mã IP thật trước khi tính Rate Limit
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Chỉ cho phép lưu lượng đi qua máy chủ OneShield (dựa trên IP kết nối TCP gốc $realip_remote_addr)
    geo $realip_remote_addr $is_oneshield {
        default 0;
        127.0.0.1/32 1;
        172.16.0.0/12 1;
        103.216.118.0/27 1;
        103.56.163.0/27 1;
        103.166.183.0/27 1;
        103.57.222.0/24 1;
        103.72.98.10/32 1;
        103.72.97.5/32 1;
        103.72.96.10/32 1;
        2001:df7:ce00:19::3:0000/112 1;
        2001:0df7:ce00:16::3:0000/112 1;
        2001:0df7:ce00:22::3:0000/112 1;
        2001:df0:1b:3::3:0/128 1;
        2001:df0:1b:2::3:0/128 1;
        2001:df0:1b:1::3:0/128 1;
    }

    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

    # Giữ nguyên X-Forwarded-Proto (https) nếu đi qua CDN/Proxy phía trước Nginx
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream cinemahub {
        server web_app:8080;
        keepalive 16;
    }

    # Chặn mọi truy cập trực tiếp qua IP VPS (lách OneShield) trên cổng 80
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /health {
            proxy_pass http://cinemahub;
            access_log off;
        }

        location / {
            return 444;
        }
    }

    # Chặn mọi truy cập trực tiếp qua IP VPS (lách OneShield) trên cổng 443
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location /health {
            proxy_pass http://cinemahub;
            access_log off;
        }

        location / {
            return 444;
        }
    }

    # HTTP Server (Chỉ cho phép tên miền đi qua OneShield & Let's Encrypt challenge)
    server {
        listen 80;
        server_name cinemahubvn.io.vn www.cinemahubvn.io.vn;

        if ($is_oneshield = 0) {
            return 444;
        }

        client_max_body_size 20M;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            proxy_pass http://cinemahub;
            expires 30d;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            access_log off;
        }

        location /health {
            proxy_pass http://cinemahub;
            access_log off;
        }

        location / {
            limit_req zone=general burst=50 nodelay;
            limit_conn addr_conn 30;

            proxy_pass http://cinemahub;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # HTTPS Server (Chỉ cho phép tên miền đi qua OneShield)
    server {
        listen 443 ssl;
        http2 on;
        server_name cinemahubvn.io.vn www.cinemahubvn.io.vn;

        if ($is_oneshield = 0) {
            return 444;
        }

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        client_max_body_size 20M;

        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            proxy_pass http://cinemahub;
            expires 30d;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            access_log off;
        }

        location /health {
            proxy_pass http://cinemahub;
            access_log off;
        }

        location / {
            limit_req zone=general burst=50 nodelay;
            limit_conn addr_conn 30;

            proxy_pass http://cinemahub;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
