name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: Build & Test ──
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore "CINEMA_MANAGEMENT.csproj"

      - name: Security scan: Check package vulnerabilities
        run: dotnet list "CINEMA_MANAGEMENT.csproj" package --vulnerable --include-transitive

      - name: Build
        run: dotnet build "CINEMA_MANAGEMENT.csproj" --no-restore --configuration Release

      - name: Security scan: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Nếu có Unit Test project thì bật dòng dưới
      # - name: Test
      #   run: dotnet test --no-build --configuration Release --verbosity normal

  # ── Job 2: Build & Push Docker Image ──
  docker-publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to VPS via SSH ──
  deploy:
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Checkout code
        if: env.VPS_HOST != ''
        uses: actions/checkout@v4

      - name: Copy compose, nginx & DB scripts to VPS
        if: env.VPS_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/*,DB/CinemaManagement_PostgreSQL.sql"
          target: "/opt/cinemahub"

      - name: Deploy via SSH
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/cinemahub
            if [ -n "${{ secrets.VPS_ENV_UPDATE_B64 }}" ]; then
              sed -i '/^ADMIN_INITIAL_PASSWORD=/d; /^VNPAY_/d; /^GOOGLE_CLIENT_ID=/d; /^GOOGLE_CLIENT_SECRET=/d; /^SMTP_/d; /^TELEGRAM_/d; /^RECAPTCHA_/d' .env.prod
              echo "" >> .env.prod
              echo "${{ secrets.VPS_ENV_UPDATE_B64 }}" | base64 -d >> .env.prod
              sed -i '/^[[:space:]]*$/N;/^\n$/D' .env.prod
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans
            docker exec cinemahub_nginx nginx -s reload || true
            docker image prune -f
            echo "✅ Deployed $(date)"
